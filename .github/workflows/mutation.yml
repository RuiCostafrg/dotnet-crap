name: Mutation testing
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  mutation-shard:
    name: mutation-shard (${{ matrix.shard-index }} / ${{ strategy.job-total }})
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Shard count constant: exactly one entry per shard, 0-based for
      # cargo-mutants --shard k/N. The total is derived with strategy.job-total.
      matrix:
        shard-index: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      - run: python3 scripts/mutation-gate.py --shard ${{ matrix.shard-index }}/${{ strategy.job-total }}
      - name: Preserve complete mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-evidence-shard-${{ matrix.shard-index }}
          path: target/mutation-runs/run-*/
          if-no-files-found: warn

  mutation:
    needs: mutation-shard
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-evidence-shard-*
          path: target/mutation-runs
          merge-multiple: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/mutation-gate.py aggregate target/mutation-runs/mutation-evidence-shard-*/run-*/
