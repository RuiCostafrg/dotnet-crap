name: Mutation testing
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/mutation-gate.py
      - name: Preserve complete mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-evidence
          path: target/mutation-runs/run-*/
          if-no-files-found: warn
