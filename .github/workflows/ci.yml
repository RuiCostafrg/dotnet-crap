name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --release
  dotnet-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rid: linux-x64, executable: dotnet-crap }
          - { os: macos-15, rid: osx-arm64, executable: dotnet-crap }
          - { os: windows-latest, rid: win-x64, executable: dotnet-crap.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: cargo test --locked
        env:
          DOTNET_CRAP_E2E: '1'
      - run: cargo build --locked --release
      - name: Pack local tool and run real .NET fixture
        env:
          DOTNET_CRAP_LOCAL_RID: ${{ matrix.rid }}
          NATIVE_EXE: ${{ matrix.executable }}
        run: |
          mkdir -p "target/dotnet-tool-stage/$DOTNET_CRAP_LOCAL_RID"
          cp "target/release/$NATIVE_EXE" "target/dotnet-tool-stage/$DOTNET_CRAP_LOCAL_RID/$NATIVE_EXE"
          bash scripts/pack-dotnet-tool.sh target/dotnet-tool-stage "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          version="$(sed -n 's/^version = "\([^\"]*\)"/\1/p' Cargo.toml | head -1)"
          dotnet tool install --tool-path target/tool --add-source target/dotnet-tool-stage/feed --version "$version" dotnet-crap
          target/tool/dotnet-crap --help
          target/tool/dotnet-crap --version
          target/tool/dotnet-crap --root examples/Fixture --threshold 100 --fail-on-empty
          set +e
          target/tool/dotnet-crap --root examples/Fixture --threshold 0
          code=$?
          set -e
          test "$code" = 1
