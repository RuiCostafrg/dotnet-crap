# Hand-maintained security boundary. cargo-dist packages artifacts but does not
# generate this workflow; see dist-workspace.toml and docs/DISTRIBUTION.md.
#
# Build and verification run with a read-only token and no environment. Only the
# publication job gets write and OIDC permissions; it runs on a fresh runner,
# checks out nothing, executes no repository code or compiled binary, and waits for
# owner approval in the `release` environment. It also stays off until the
# owner sets the repository variable DOTNET_CRAP_PUBLISH to `true` after the
# PLAN step 9 host protections exist. A manual dispatch is always a dry run.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: >-
      github.repository == 'RuiCostafrg/dotnet-crap' &&
      github.actor_id == '35194998' &&
      github.triggering_actor == 'RuiCostafrg' &&
      (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate tag, Cargo version, ancestry and successful main CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [[ "$EVENT" != push ]]; then
            echo 'tag=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          [[ "$REF_NAME" == "v$version" ]] || { echo "::error::tag $REF_NAME does not match Cargo version $version"; exit 1; }
          for workflow in ci.yml security.yml distribution.yml; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.run_number, .run_attempt) | last | .conclusion == "success"' \
              | grep -Fx true || { echo "::error::$workflow has not succeeded on main for $GITHUB_SHA"; exit 1; }
          done
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
  build:
    needs: preflight
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
  verify-installation:
    needs: build
    uses: ./.github/workflows/installation.yml
    with:
      version: ${{ needs.build.outputs.version }}
  verify-action:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/github-action.yml
    with:
      version: ${{ needs.build.outputs.version }}
  publish:
    needs: [preflight, build, verify-installation, verify-action]
    if: github.event_name == 'push' && vars.DOTNET_CRAP_PUBLISH == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # No checkout, compiled binary, downloaded script, or cargo-dist runs in
      # this job. Artifacts remain data, on a fresh runner, after owner approval.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Check the exact payload that verification tested
        env:
          EXPECTED: ${{ needs.build.outputs.digest }}
        run: |
          digest=$(cd release-assets && sha256sum -- * | LC_ALL=C sort -k2 | sha256sum | cut -d' ' -f1)
          [[ "$digest" == "$EXPECTED" ]] || { echo "::error::artifacts differ from the verified build"; exit 1; }
      # The formula is attested so the tap's sync job can verify it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/*
          create-storage-record: false
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          # The tag must still name the commit these assets were built from.
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" == "$GITHUB_SHA" ]] \
            || { echo "::error::$TAG no longer points at $GITHUB_SHA"; exit 1; }
          # Never add to or replace an existing release, including a leftover draft.
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          [[ -z "$existing" ]] || { echo "::error::a release (possibly a draft) already exists for $TAG; inspect it manually"; exit 1; }
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "dotnet-crap $TAG" --generate-notes "${flags[@]}" release-assets/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          # Settings reads require Administration, which GITHUB_TOKEN cannot
          # hold. The owner verifies the setting before tagging; confirm the
          # public release itself is locked before completing publication.
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)" == true ]] \
            || { echo '::error::published release is not immutable; inspect it manually'; exit 1; }
