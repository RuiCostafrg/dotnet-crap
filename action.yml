name: Set up dotnet-crap
description: Install a pinned native dotnet-crap release with SHA-256 verification
inputs:
  version:
    description: Exact release version without the v prefix
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DOTNET_CRAP_VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install-action.sh"
